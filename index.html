<style>
:root{
  --paper:#F5F7FB; --card:#FFFFFF; --ink:#1E2F6B; --text:#1B2233; --muted:#6B7690; --line:#DCE3EE; --grid:#E8EDF5;
  --red:#D23B2F; --redbg:#FBE3E0; --hl:#FFE45C; --hlbg:#FFF6C2; --ok:#2E8B57; --okbg:#DDF2E5;
  --body:"Golos Text",-apple-system,"Segoe UI",Roboto,sans-serif; --disp:"Unbounded","Golos Text",-apple-system,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0F1424; --card:#171E35; --ink:#AFC2FF; --text:#E6EAF5; --muted:#8892AE; --line:#29324D; --grid:#151C30;
  --red:#FF6B5E; --redbg:#3A1D22; --hl:#E8C93A; --hlbg:#3A3518; --ok:#4CC38A; --okbg:#15332A;}}
:root[data-theme="dark"]{--paper:#0F1424; --card:#171E35; --ink:#AFC2FF; --text:#E6EAF5; --muted:#8892AE; --line:#29324D; --grid:#151C30;
  --red:#FF6B5E; --redbg:#3A1D22; --hl:#E8C93A; --hlbg:#3A3518; --ok:#4CC38A; --okbg:#15332A;}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;font-family:var(--body);color:var(--text);font-size:16px;line-height:1.4;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 110px}

/* header */
.top{display:flex;align-items:center;gap:8px;margin:6px 0 14px}
.top h1{font-family:var(--disp);font-weight:700;font-size:28px;letter-spacing:-.02em;color:var(--ink);margin:0;flex:1;line-height:1.1}
.top h1 small{display:block;font-family:var(--body);font-weight:500;font-size:14px;color:var(--muted);letter-spacing:0;margin-top:4px}
.arrow{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);font-size:20px;color:var(--ink);display:grid;place-items:center}
.today-btn{border:none;background:none;color:var(--ink);font-weight:600;font-size:14px;padding:6px 4px;text-decoration:underline;text-underline-offset:3px}

/* alerts */
.alerts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{border:none;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:600}
.chip.pay{background:var(--redbg);color:var(--red)}
.chip.soon{background:var(--hlbg);color:var(--text)}

/* days */
.day{margin-bottom:14px}
.day-h{display:flex;align-items:baseline;justify-content:space-between;margin:0 2px 6px}
.day-h b{font-weight:700;font-size:15px}
.day.is-today .day-h b{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
.day-h span{color:var(--muted);font-size:13px}
.add-mini{border:none;background:none;color:var(--ink);font-size:14px;font-weight:600;padding:2px 4px}
.list{background:var(--card);border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px 12px 14px;border-top:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
.row:first-child{border-top:none}
.row .t{font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink);width:48px;flex:none}
.row .who{flex:1;min-width:0}
.row .who b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .who span{font-size:13px;color:var(--muted)}
.row.cancel .who b,.row.cancel .t{text-decoration:line-through;color:var(--muted)}
.row.done .who b{color:var(--muted)}
.tick{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.tick svg{width:18px;height:18px;opacity:0}
.row.done .tick{background:var(--ink);border-color:var(--ink)}
.row.done .tick svg{opacity:1}
.empty-day{color:var(--muted);font-size:14px;padding:4px 2px}

/* students */
.sec-title{font-family:var(--disp);font-weight:700;font-size:28px;color:var(--ink);margin:6px 0 16px;letter-spacing:-.02em}
.st{display:flex;align-items:center;gap:12px;padding:14px;border-top:1px solid var(--line);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left}
.st:first-child{border-top:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.dot.pay{background:var(--red)} .dot.soon{background:var(--hl)} .dot.ok{background:var(--ok)}
.st .who{flex:1;min-width:0}
.st .who b{display:block;font-weight:600}
.st .who span{font-size:13px;color:var(--muted)}
.st .stat{font-size:14px;font-weight:600;text-align:right}
.st .stat.pay{color:var(--red)}
.big-btn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:14px;border:1.5px dashed var(--ink);background:transparent;color:var(--ink);font-weight:600}
.note{color:var(--muted);font-size:13px;margin-top:14px;text-align:center}
.empty{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1.5px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;max-width:200px;border:none;background:none;padding:8px;border-radius:10px;font-weight:600;color:var(--muted);font-size:15px}
.tabs button[aria-selected="true"]{color:var(--ink);background:var(--paper)}

/* sheet */
.veil{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:10;display:none}
.veil.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;overflow:auto;background:var(--card);border-radius:20px 20px 0 0;z-index:11;
  padding:18px 18px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h2{font-family:var(--disp);font-weight:700;font-size:21px;color:var(--ink);margin:0 0 4px;letter-spacing:-.01em}
.sheet .sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;font-weight:500}
.field input,.field select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);font-size:16px;min-height:44px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:none;background:var(--paper);padding:10px 4px;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.slot{display:flex;gap:8px;margin-bottom:8px}
.slot select{flex:1.3} .slot input{flex:1}
.slot select,.slot input{padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);min-height:44px;font-size:16px}
.x{flex:none;width:44px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--muted);font-size:18px}
.link{border:none;background:none;color:var(--ink);font-weight:600;padding:6px 0;font-size:15px}
.actions{display:grid;gap:10px;margin-top:6px}
.btn{width:100%;padding:13px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;font-size:16px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--card)}
.btn.danger{color:var(--red);background:transparent;border-color:transparent}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pays{margin-top:6px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.pay-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line);font-size:14px}
.pay-row:first-child{border-top:none}
.pay-row span{flex:1}
.pay-row .x{width:34px;height:34px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.stats div{background:var(--paper);border-radius:10px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
.total{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
.total b{display:block;font-family:var(--disp);font-weight:700;font-size:38px;color:var(--ink);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.total span{color:var(--muted);font-size:14px}
.minis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.minis div{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.minis b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
.minis span{font-size:13px;color:var(--muted)}
.h3{font-weight:700;font-size:15px;margin:0 2px 8px}
.earn{padding:12px 14px;border-top:1px solid var(--line)}
.earn:first-child{border-top:none}
.earn .l{display:flex;justify-content:space-between;gap:10px}
.earn .l b{font-weight:600}
.earn .l span{font-variant-numeric:tabular-nums;font-weight:600}
.earn small{color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--paper);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:3px}
hr{border:none;border-top:1px solid var(--line);margin:18px 0}
.hidden{display:none!important}
</style>
</head>
<body>
<main class="wrap" id="app"><p class="note">Загрузка…</p></main>
<nav class="tabs" role="tablist">
  <button role="tab" data-tab="week" aria-selected="true">Неделя</button>
  <button role="tab" data-tab="students" aria-selected="false">Ученики</button>
  <button role="tab" data-tab="money" aria-selected="false">Заработок</button>
</nav>
<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true"></section>

<script>
/* ---------- helpers ---------- */
const DAYS=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const DSHORT=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'];
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const TYPES={pack:'Пакет',week:'Неделя',single:'Разовая'};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const today=()=>iso(new Date());
const weekStart=s=>{const d=parse(s);const w=(d.getDay()+6)%7;d.setDate(d.getDate()-w);return iso(d)};
const dayIdx=s=>(parse(s).getDay()+6)%7;
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmt=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const rid=()=>Math.random().toString(36).slice(2,10);
const money=n=>(+n||0).toLocaleString('ru-RU');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const lid=(sid,date,time)=>sid+'_'+date+'_'+time.replace(':','');
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const m=n%10;if(n>10&&n<20)return c;if(m>1&&m<5)return b;if(m===1)return a;return c};

/* ---------- state + storage ---------- */
const S={students:[],lessons:{},payments:{}};
let mode='loading', store=null;
const ui={tab:'week',week:weekStart(today()),month:today().slice(0,7)};

function lsStore(){
  const K='lessons-app-v1';
  try{const d=JSON.parse(localStorage.getItem(K)||'null');if(d){S.students=d.students||[];S.lessons=d.lessons||{};S.payments=d.payments||{}}}catch(e){}
  const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
  return{
    saveStudents(){save()},
    saveLesson(id,r){if(r)S.lessons[id]=r;else delete S.lessons[id];save()},
    savePayment(id,p){if(p)S.payments[id]=p;else delete S.payments[id];save()}
  };
}
function init(){mode='local';store=lsStore();render()}

/* ---------- logic ---------- */
const stu=id=>S.students.find(s=>s.id===id);
function status(st){
  const pays=Object.values(S.payments).filter(p=>p.sid===st.id);
  const done=Object.values(S.lessons).filter(l=>l.sid===st.id&&l.done).length;
  const paid=pays.reduce((a,p)=>a+(+p.count||0),0);
  const last=pays.map(p=>p.date).sort().pop()||null;
  const r={done,paid,last,level:'ok',text:'',short:''};
  if(st.type==='week'){
    let until=null;pays.forEach(p=>{const u=addDays(p.date,7*(+p.count||1));if(!until||u>until)until=u});
    r.until=until;
    if(!until){r.level='pay';r.text='Ещё не оплачено';r.short='оплатить'}
    else{const d=diff(today(),until);
      if(d<=0){r.level='pay';r.text='Оплата с '+fmt(until);r.short='оплатить'}
      else{r.level=d<=1?'soon':'ok';r.text='Следующая оплата '+fmt(until);r.short='до '+fmt(until)}}
  }else if(st.type==='pack'){
    const left=paid-done;r.left=left;
    if(left<0){r.level='pay';r.text='Долг '+(-left)+' зан.';r.short='долг '+(-left)}
    else if(left===0){r.level='pay';r.text=paid?'Пакет закончился':'Ещё не оплачено';r.short='оплатить'}
    else{r.level=left===1?'soon':'ok';r.text='Осталось '+left+' '+plural(left,'занятие','занятия','занятий');r.short='осталось '+left}
  }else{
    const debt=done-paid;r.debt=debt;
    if(debt>0){r.level='pay';r.text='Долг '+debt+' зан. · '+money(debt*(+st.price||0));r.short='долг '+debt}
    else{r.text='Долгов нет';r.short='оплачено'}
  }
  return r;
}
function weekItems(ws){
  const days=[...Array(7)].map((_,i)=>addDays(ws,i)),we=days[6],items=[];
  S.students.forEach(st=>(st.slots||[]).forEach(sl=>{
    const date=days[sl.d];if(!sl.t||(st.since&&date<st.since))return;
    const id=lid(st.id,date,sl.t);if(S.lessons[id])return;
    items.push({id,sid:st.id,date,time:sl.t,origDate:date,origTime:sl.t,rec:null});
  }));
  Object.entries(S.lessons).forEach(([id,r])=>{
    const date=r.moved?r.moved.date:r.date,time=r.moved?r.moved.time:r.time;
    if(date>=ws&&date<=we&&stu(r.sid))items.push({id,sid:r.sid,date,time,origDate:r.date,origTime:r.time,rec:r});
  });
  return items.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
}
function recOf(it){return it.rec?clone(it.rec):{sid:it.sid,date:it.origDate,time:it.origTime,done:false,cancelled:false,moved:null,extra:false}}
function putRec(id,r){const def=!r.done&&!r.cancelled&&!r.moved&&!r.extra;store.saveLesson(id,def?null:r);render()}

/* ---------- render ---------- */
const app=document.getElementById('app');
const TICK='<svg viewBox="0 0 24 24" fill="none" stroke="var(--card)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';
function render(){
  if(mode==='loading')return;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===ui.tab));
  app.innerHTML=ui.tab==='week'?renderWeek():ui.tab==='money'?renderMoney():renderStudents();
}
function renderWeek(){
  const ws=ui.week,we=addDays(ws,6),items=weekItems(ws),t=today();
  const p0=parse(ws),p1=parse(we);
  const range=p0.getMonth()===p1.getMonth()?p0.getDate()+'–'+p1.getDate()+' '+MON[p1.getMonth()]:fmt(ws)+' – '+fmt(we);
  const isCur=ws===weekStart(t);
  let h=`<div class="top"><button class="arrow" data-act="prev" aria-label="Предыдущая неделя">‹</button>
    <h1>${range}<small>${isCur?'Эта неделя':'<button class="today-btn" data-act="cur">К текущей неделе</button>'}</small></h1>
    <button class="arrow" data-act="next" aria-label="Следующая неделя">›</button></div>`;
  const al=S.students.map(s=>({s,r:status(s)})).filter(x=>x.r.level!=='ok');
  if(al.length)h+=`<div class="alerts">${al.map(x=>`<button class="chip ${x.r.level}" data-act="pay" data-sid="${x.s.id}">${esc(x.s.name)}: ${esc(x.r.short)}</button>`).join('')}</div>`;
  if(!S.students.length)return h+`<div class="empty">Добавьте учеников и их расписание во вкладке «Ученики» — занятия появятся здесь.<button class="big-btn" data-act="newstu">Добавить ученика</button></div>`;
  for(let i=0;i<7;i++){
    const d=addDays(ws,i),di=items.filter(x=>x.date===d);
    h+=`<div class="day${d===t?' is-today':''}"><div class="day-h"><b>${DAYS[i]}, ${fmt(d)}</b><button class="add-mini" data-act="add" data-date="${d}" aria-label="Добавить занятие">+ занятие</button></div>`;
    if(!di.length)h+=`<div class="empty-day">Нет занятий</div>`;
    else h+=`<div class="list">${di.map(it=>{
      const st=stu(it.sid),r=it.rec||{};
      let sub=TYPES[st.type];
      if(r.cancelled)sub='Отменено';
      else if(r.moved)sub='Перенесено с '+fmt(it.origDate)+', '+it.origTime;
      else if(r.extra)sub='Доп. занятие';
      const cls=(r.done?' done':'')+(r.cancelled?' cancel':'');
      return `<div class="row${cls}" data-act="lesson" data-id="${it.id}" data-date="${it.date}" role="button" tabindex="0">
        <span class="t">${it.time}</span><span class="who"><b>${esc(st.name)}</b><span>${esc(sub)}</span></span>
        ${r.cancelled?'':`<button class="tick" data-act="tick" data-id="${it.id}" data-date="${it.date}" aria-label="${r.done?'Снять отметку':'Отметить проведённым'}">${TICK}</button>`}</div>`;
    }).join('')}</div>`;
    h+='</div>';
  }
  return h;
}
const MONTHS=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
function shiftMonth(m,n){let[y,mm]=m.split('-').map(Number);mm+=n;while(mm>12){mm-=12;y++}while(mm<1){mm+=12;y--}return y+'-'+pad(mm)}
function renderMoney(){
  const m=ui.month,y=m.slice(0,4),[yy,mm]=m.split('-').map(Number);
  const pays=Object.values(S.payments);
  const sum=a=>a.reduce((t,p)=>t+(+p.amount||0),0);
  const mp=pays.filter(p=>p.date.slice(0,7)===m).sort((a,b)=>b.date.localeCompare(a.date));
  const total=sum(mp),yearT=sum(pays.filter(p=>p.date.slice(0,4)===y)),allT=sum(pays);
  const doneM=Object.values(S.lessons).filter(l=>l.done&&(l.moved?l.moved.date:l.date).slice(0,7)===m);
  const cur=m===today().slice(0,7);
  let h=`<div class="top"><button class="arrow" data-act="mprev" aria-label="Предыдущий месяц">‹</button>
    <h1>${MONTHS[mm-1]}<small>${yy}${cur?'':' · <button class="today-btn" data-act="mcur">К текущему месяцу</button>'}</small></h1>
    <button class="arrow" data-act="mnext" aria-label="Следующий месяц">›</button></div>
    <div class="total"><b>${money(total)}</b><span>получено за месяц · ${mp.length} ${plural(mp.length,'оплата','оплаты','оплат')} · проведено ${doneM.length} ${plural(doneM.length,'занятие','занятия','занятий')}</span></div>
    <div class="minis"><div><b>${money(yearT)}</b><span>за ${y} год</span></div><div><b>${money(allT)}</b><span>за всё время</span></div></div>`;
  const by={};mp.forEach(p=>{(by[p.sid]=by[p.sid]||{sum:0,n:0}).sum+=(+p.amount||0)});
  doneM.forEach(l=>{(by[l.sid]=by[l.sid]||{sum:0,n:0}).n++});
  const rows=Object.entries(by).filter(([sid])=>stu(sid)).sort((a,b)=>b[1].sum-a[1].sum);
  const max=Math.max(1,...rows.map(r=>r[1].sum));
  h+=`<p class="h3">По ученикам</p>`;
  if(!rows.length)h+=`<div class="empty">В этом месяце оплат и занятий нет</div>`;
  else h+=`<div class="list">${rows.map(([sid,v])=>`<div class="earn"><div class="l"><b>${esc(stu(sid).name)}</b><span>${money(v.sum)}</span></div>
    <small>${TYPES[stu(sid).type]} · проведено ${v.n}</small><div class="bar"><i style="width:${Math.round(v.sum/max*100)}%"></i></div></div>`).join('')}</div>`;
  if(mp.length)h+=`<p class="h3" style="margin-top:18px">Оплаты</p><div class="list">${mp.map(p=>{const st=stu(p.sid);
    return `<div class="earn"><div class="l"><b>${esc(st?st.name:'Удалён')}</b><span>${money(p.amount)}</span></div><small>${fmt(p.date)} · ${p.count} ${st&&st.type==='week'?plural(p.count,'неделя','недели','недель'):'зан.'}</small></div>`}).join('')}</div>`;
  return h;
}
function renderStudents(){
  let h=`<h1 class="sec-title">Ученики</h1>`;
  if(!S.students.length)h+=`<div class="empty">Пока никого нет</div>`;
  else h+=`<div class="list">${S.students.map(s=>{const r=status(s);
    return `<button class="st" data-act="stu" data-sid="${s.id}"><span class="dot ${r.level}"></span>
      <span class="who"><b>${esc(s.name)}</b><span>${TYPES[s.type]} · проведено ${r.done}</span></span>
      <span class="stat ${r.level==='pay'?'pay':''}">${esc(r.text)}</span></button>`}).join('')}</div>`;
  h+=`<button class="big-btn" data-act="newstu">Добавить ученика</button>`;
  h+=`<hr><p class="note" style="text-align:left;margin:0 0 10px">Данные хранятся только на этом телефоне. Время от времени копируйте резервную копию в Заметки.</p>
    <div class="two"><button class="btn" data-act="backup">Копировать копию</button><button class="btn" data-act="restore">Восстановить</button></div>`;
  return h;
}

/* ---------- sheet ---------- */
const sheet=document.getElementById('sheet'),veil=document.getElementById('veil');
function openSheet(html,bind){sheet.innerHTML=html;veil.classList.add('open');sheet.classList.add('open');bind&&bind(sheet);sheet.scrollTop=0}
function closeSheet(){sheet.classList.remove('open');veil.classList.remove('open')}
veil.onclick=closeSheet;
const $=s=>sheet.querySelector(s);

function findItem(id,date){const ws=weekStart(date);return weekItems(ws).find(x=>x.id===id)}

function lessonSheet(it){
  const st=stu(it.sid),r=it.rec||{},stt=status(st);
  openSheet(`<h2>${esc(st.name)}</h2><div class="sub">${DAYS[dayIdx(it.date)]}, ${fmt(it.date)} в ${it.time} · ${esc(stt.text)}</div>
    <div class="actions">
      ${r.cancelled?'':`<button class="btn primary" id="l-done">${r.done?'Снять отметку':'Провёл занятие'}</button>`}
      <button class="btn" id="l-move">Перенести</button>
      <div id="move" class="hidden"><div class="two"><div class="field"><label>Новая дата</label><input type="date" id="m-date" value="${it.date}"></div>
        <div class="field"><label>Время</label><input type="time" id="m-time" value="${it.time}"></div></div>
        <button class="btn primary" id="m-save">Сохранить перенос</button></div>
      <button class="btn" id="l-pay">Записать оплату</button>
      ${r.extra?`<button class="btn danger" id="l-del">Удалить занятие</button>`:`<button class="btn danger" id="l-cancel">${r.cancelled?'Вернуть занятие':'Отменить занятие'}</button>`}
    </div>`,()=>{
    const d=$('#l-done');if(d)d.onclick=()=>{const x=recOf(it);x.done=!x.done;putRec(it.id,x);closeSheet()};
    $('#l-move').onclick=()=>$('#move').classList.toggle('hidden');
    $('#m-save').onclick=()=>{const nd=$('#m-date').value,nt=$('#m-time').value;if(!nd||!nt)return;
      const x=recOf(it);
      if(x.extra){x.date=nd;x.time=nt;x.moved=null}
      else x.moved=(nd===x.date&&nt===x.time)?null:{date:nd,time:nt};
      x.cancelled=false;putRec(it.id,x);ui.week=weekStart(nd);closeSheet();render()};
    $('#l-pay').onclick=()=>paySheet(st);
    const c=$('#l-cancel');if(c)c.onclick=()=>{const x=recOf(it);x.cancelled=!x.cancelled;if(x.cancelled)x.done=false;putRec(it.id,x);closeSheet()};
    const del=$('#l-del');if(del)del.onclick=()=>{store.saveLesson(it.id,null);render();closeSheet()};
  });
}

function addSheet(date){
  if(!S.students.length)return studentSheet(null);
  openSheet(`<h2>Новое занятие</h2><div class="sub">Разовое, вне расписания</div>
    <div class="field"><label>Ученик</label><select id="a-s">${S.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div>
    <div class="two"><div class="field"><label>Дата</label><input type="date" id="a-d" value="${date}"></div>
    <div class="field"><label>Время</label><input type="time" id="a-t" value="16:00"></div></div>
    <div class="actions"><button class="btn primary" id="a-save">Добавить</button></div>`,()=>{
    $('#a-save').onclick=()=>{const sid=$('#a-s').value,d=$('#a-d').value,t=$('#a-t').value;if(!d||!t)return;
      store.saveLesson('x'+rid(),{sid,date:d,time:t,done:false,cancelled:false,moved:null,extra:true});ui.week=weekStart(d);render();closeSheet()};
  });
}

function countLabel(t){return t==='week'?'Недель':t==='pack'?'Занятий в оплате':'Занятий'}
function defAmount(st,n){const p=+st.price||0;return st.type==='pack'?Math.round(p*n/((+st.pack)||n)):p*n}
function paySheet(st){
  const n0=st.type==='pack'?(+st.pack||8):1;
  openSheet(`<h2>Оплата</h2><div class="sub">${esc(st.name)} · ${TYPES[st.type]}</div>
    <div class="field"><label>Дата</label><input type="date" id="p-d" value="${today()}"></div>
    <div class="two"><div class="field"><label>${countLabel(st.type)}</label><input type="number" inputmode="numeric" min="1" id="p-n" value="${n0}"></div>
    <div class="field"><label>Сумма</label><input type="number" inputmode="numeric" min="0" id="p-a" value="${defAmount(st,n0)}"></div></div>
    <div class="actions"><button class="btn primary" id="p-save">Сохранить оплату</button></div>`,()=>{
    let touched=false;$('#p-a').oninput=()=>touched=true;
    $('#p-n').oninput=()=>{if(!touched)$('#p-a').value=defAmount(st,+$('#p-n').value||0)};
    $('#p-save').onclick=()=>{const d=$('#p-d').value,n=Math.max(1,parseInt($('#p-n').value)||1);if(!d)return;
      store.savePayment(rid(),{sid:st.id,date:d,count:n,amount:+$('#p-a').value||0});render();closeSheet()};
  });
}

function studentSheet(st){
  const isNew=!st;
  const s=st?clone(st):{id:rid(),name:'',type:'pack',price:'',pack:8,slots:[{d:0,t:'16:00'}],since:weekStart(today())};
  const r=isNew?null:status(st);
  const pays=isNew?[]:Object.entries(S.payments).filter(([,p])=>p.sid===s.id).sort((a,b)=>b[1].date.localeCompare(a[1].date));
  const priceLabel=t=>t==='pack'?'Цена пакета':t==='week'?'Цена за неделю':'Цена занятия';
  const slotRow=(sl,i)=>`<div class="slot" data-i="${i}"><select class="s-d">${DAYS.map((d,j)=>`<option value="${j}"${j==sl.d?' selected':''}>${d}</option>`).join('')}</select>
    <input type="time" class="s-t" value="${sl.t}"><button class="x" data-rm="${i}" aria-label="Убрать">×</button></div>`;
  const statsHtml=isNew?'':`<div class="stats"><div><b>${r.done}</b><span>проведено</span></div>
    <div><b>${s.type==='week'?(r.until?fmt(r.until):'—'):s.type==='pack'?r.left:Math.max(0,r.debt)}</b><span>${s.type==='week'?'след. оплата':s.type==='pack'?'осталось':'долг, зан.'}</span></div>
    <div><b>${r.last?fmt(r.last):'—'}</b><span>посл. оплата</span></div></div>`;
  openSheet(`<h2>${isNew?'Новый ученик':esc(s.name)}</h2><div class="sub">${isNew?'Имя, тип оплаты и расписание':esc(r.text)}</div>
    ${statsHtml}
    ${isNew?'':`<button class="btn primary" id="s-pay">Записать оплату</button><hr>`}
    <div class="field"><label>Имя</label><input id="s-name" value="${esc(s.name)}" autocomplete="off"></div>
    <div class="field"><label>Как платит</label><div class="seg" id="s-type">${Object.entries(TYPES).map(([k,v])=>`<button type="button" data-t="${k}" aria-pressed="${k===s.type}">${v==='Пакет'?'Пакетом':v==='Неделя'?'За неделю':'За занятие'}</button>`).join('')}</div></div>
    <div class="two"><div class="field"><label id="pl">${priceLabel(s.type)}</label><input type="number" inputmode="numeric" id="s-price" value="${esc(s.price)}"></div>
    <div class="field" id="packf"><label>Занятий в пакете</label><input type="number" inputmode="numeric" id="s-pack" value="${esc(s.pack||8)}"></div></div>
    <div class="field"><label>Расписание на каждую неделю</label><div id="slots">${s.slots.map(slotRow).join('')}</div>
      <button class="link" id="s-add">+ добавить день</button></div>
    <div class="actions"><button class="btn primary" id="s-save">${isNew?'Добавить ученика':'Сохранить'}</button>
      ${isNew?'':`<button class="btn danger" id="s-del">Удалить ученика</button>`}</div>
    ${pays.length?`<hr><div class="field"><label>История оплат</label><div class="pays">${pays.map(([id,p])=>`<div class="pay-row"><span>${fmt(p.date)} · ${money(p.amount)} · ${p.count} ${s.type==='week'?plural(p.count,'неделя','недели','недель'):'зан.'}</span><button class="x" data-delpay="${id}" aria-label="Удалить оплату">×</button></div>`).join('')}</div></div>`:''}`,()=>{
    const readSlots=()=>[...sheet.querySelectorAll('.slot')].map(el=>({d:+el.querySelector('.s-d').value,t:el.querySelector('.s-t').value}));
    const drawSlots=sl=>{$('#slots').innerHTML=sl.map(slotRow).join('')};
    const syncType=()=>{$('#packf').classList.toggle('hidden',s.type!=='pack');$('#pl').textContent=priceLabel(s.type)};syncType();
    $('#s-type').onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;s.type=b.dataset.t;
      sheet.querySelectorAll('#s-type button').forEach(x=>x.setAttribute('aria-pressed',x===b));syncType()};
    $('#s-add').onclick=()=>{const sl=readSlots();sl.push({d:sl.length?Math.min(6,sl[sl.length-1].d+2):0,t:sl.length?sl[sl.length-1].t:'16:00'});drawSlots(sl)};
    $('#slots').onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;const sl=readSlots();sl.splice(+b.dataset.rm,1);drawSlots(sl)};
    $('#s-save').onclick=()=>{
      const name=$('#s-name').value.trim();if(!name){$('#s-name').focus();return}
      s.name=name;s.price=+$('#s-price').value||0;s.pack=+$('#s-pack').value||8;s.slots=readSlots().filter(x=>x.t);
      const i=S.students.findIndex(x=>x.id===s.id);if(i<0)S.students.push(s);else S.students[i]=s;
      store.saveStudents();render();closeSheet()};
    const p=$('#s-pay');if(p)p.onclick=()=>paySheet(st);
    const del=$('#s-del');if(del)del.onclick=()=>{if(!confirm('Удалить '+s.name+'? Занятия и оплаты тоже удалятся.'))return;
      S.students=S.students.filter(x=>x.id!==s.id);store.saveStudents();
      Object.entries(S.lessons).forEach(([id,l])=>{if(l.sid===s.id)store.saveLesson(id,null)});
      Object.entries(S.payments).forEach(([id,pp])=>{if(pp.sid===s.id)store.savePayment(id,null)});
      render();closeSheet()};
    sheet.querySelectorAll('[data-delpay]').forEach(b=>b.onclick=()=>{if(!confirm('Удалить эту оплату?'))return;store.savePayment(b.dataset.delpay,null);render();studentSheet(stu(s.id))});
  });
}

/* ---------- backup ---------- */
async function backup(){
  const txt=JSON.stringify({app:'lessons',v:1,saved:today(),students:S.students,lessons:S.lessons,payments:S.payments});
  try{await navigator.clipboard.writeText(txt);alert('Копия скопирована. Вставьте её в Заметки.')}
  catch(e){openSheet(`<h2>Резервная копия</h2><div class="sub">Выделите и скопируйте весь текст</div><textarea id="b-t" readonly style="width:100%;height:220px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px;font-size:13px">${esc(txt)}</textarea>`,()=>{$('#b-t').select()})}
}
function restoreSheet(){
  openSheet(`<h2>Восстановить</h2><div class="sub">Вставьте текст резервной копии. Текущие данные заменятся.</div>
    <textarea id="r-t" style="width:100%;height:200px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);padding:10px;font-size:16px"></textarea>
    <div class="actions"><button class="btn primary" id="r-go">Восстановить</button></div>`,()=>{
    $('#r-go').onclick=()=>{let d;try{d=JSON.parse($('#r-t').value.trim())}catch(e){alert('Текст не похож на резервную копию.');return}
      if(!d||!Array.isArray(d.students)){alert('Текст не похож на резервную копию.');return}
      if(!confirm('Заменить текущие данные копией от '+(d.saved?fmt(d.saved):'неизвестной даты')+'?'))return;
      S.students=d.students;S.lessons=d.lessons||{};S.payments=d.payments||{};store.saveStudents();render();closeSheet()};
  });
}

/* ---------- events ---------- */
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;ui.tab=b.dataset.tab;render();window.scrollTo(0,0)};
app.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='tick'){e.stopPropagation();const it=findItem(el.dataset.id,el.dataset.date);if(!it)return;const x=recOf(it);x.done=!x.done;putRec(it.id,x);return}
  if(a==='prev'){ui.week=addDays(ui.week,-7);render()}
  else if(a==='next'){ui.week=addDays(ui.week,7);render()}
  else if(a==='cur'){ui.week=weekStart(today());render()}
  else if(a==='lesson'){const it=findItem(el.dataset.id,el.dataset.date);if(it)lessonSheet(it)}
  else if(a==='add')addSheet(el.dataset.date);
  else if(a==='pay'){const s=stu(el.dataset.sid);if(s)paySheet(s)}
  else if(a==='stu'){const s=stu(el.dataset.sid);if(s)studentSheet(s)}
  else if(a==='newstu')studentSheet(null);
  else if(a==='backup')backup();
  else if(a==='mprev'){ui.month=shiftMonth(ui.month,-1);render()}
  else if(a==='mnext'){ui.month=shiftMonth(ui.month,1);render()}
  else if(a==='mcur'){ui.month=today().slice(0,7);render()}
  else if(a==='restore')restoreSheet();
});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row')){e.preventDefault();e.target.click()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
init();
</script>
</body>
</html>
